# Local full stack: app + Postgres + Prometheus + Grafana.
#
#   docker compose up --build
#
#   app        http://localhost:8000
#   prometheus http://localhost:9090
#   grafana    http://localhost:3000  (admin / admin)
#
# The Grafana datasource and the pipeline-lab dashboard are provisioned
# automatically from observability/grafana/.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipeline_lab
      POSTGRES_PASSWORD: pipeline_lab
      POSTGRES_DB: pipeline_lab
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipeline_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://pipeline_lab:pipeline_lab@db:5432/pipeline_lab
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus

volumes:
  db-data:
  prom-data:
  grafana-data:
