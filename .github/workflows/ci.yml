name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -v

  test-postgres:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pipeline_lab
          POSTGRES_PASSWORD: pipeline_lab
          POSTGRES_DB: pipeline_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pipeline_lab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests against Postgres
        env:
          TEST_DATABASE_URL: postgresql://pipeline_lab:pipeline_lab@localhost:5432/pipeline_lab
        run: pytest -v

  build-docker:
    name: Build and smoke test container
    needs: [test, test-postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t pipeline-lab:${{ github.sha }} .

      - name: Smoke test the container
        run: |
          docker run -d -p 8000:8000 --name pipeline-lab pipeline-lab:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8000/health || exit 1
          docker stop pipeline-lab
